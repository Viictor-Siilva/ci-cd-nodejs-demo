name: Pipeline de CI - ci-cd-nodejs-demo

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm install

      - name: Rodar testes
        run: npm test

      # SCA: falha se houver vulnerabilidade HIGH ou CRITICAL nas dependencias
      - name: Verificar vulnerabilidades de dependencias (SCA)
        run: npm audit --audit-level=high

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build local (sem publicar) para poder escanear a imagem
      - name: Build da imagem Docker (para escaneamento)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ci-cd-nodejs-demo:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Container Scan: falha se houver vulnerabilidade CRITICAL
      - name: Escanear imagem com Trivy (Container Scan)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ci-cd-nodejs-demo:scan
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Logar no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair Metadados do Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Push da Imagem Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy-to-local:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: self-hosted

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Logar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fazer Deploy com Docker Compose
        run: |
          docker compose pull
          docker compose up -d --no-build
          docker image prune -f